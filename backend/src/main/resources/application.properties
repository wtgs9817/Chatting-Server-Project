spring.application.name=Chatting-Server-Project

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.url=jdbc:mysql://host.docker.internal:3306/chatting-server-test-db?rewriteBatchedStatements=true&serverTimezone=Asia/Seoul
spring.datasource.url=jdbc:mysql://localhost:3306/chatting-server-test-db?rewriteBatchedStatements=true&serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.password=asdf1193

# 기본값(10)은 600명 동시 chat.join + flush()의 DB write가 동시에 몰릴 때 병목이 됨
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.connection-timeout=10000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.generate_statistics=true


server.tomcat.threads.max=400  
server.tomcat.threads.min-spare=50 
server.tomcat.accept-count=200